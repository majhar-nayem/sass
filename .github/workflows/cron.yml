name: Nightly sweep
on:
  # 20:30 UTC = 7:00am Adelaide during ACDT (October–April), which covers the Christmas
  # launch. Under ACST it lands at 6:00am. Cron has no notion of daylight saving and
  # Adelaide's half-hour offset makes a single expression impossible; an hour early in
  # winter is the cheaper error.
  schedule: [{ cron: '30 20 * * *' }]
  workflow_dispatch:

jobs:
  sweep:
    runs-on: ubuntu-latest
    # Without the secret this would fail every night and train everyone to ignore it.
    if: ${{ github.event_name == 'workflow_dispatch' || vars.CRON_ENABLED == 'true' }}
    steps:
      - name: domains, dunning, digest
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          APP_URL: ${{ vars.APP_URL || 'https://app.awning.au' }}
        run: |
          [ -n "$CRON_SECRET" ] || { echo "::error::CRON_SECRET not set"; exit 1; }
          curl -fsS --max-time 300 -X POST \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$APP_URL/api/cron?job=all" | tee /dev/stderr
