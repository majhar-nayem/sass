name: CI
on:
  push: { branches: [main] }
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: awning
          POSTGRES_PASSWORD: awning
          POSTGRES_DB: awning
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 2s --health-timeout 3s --health-retries 20
      # Tenant resolution is the hottest path in the system and its cache behaviour has
      # its own tests. Without this service four of them fail.
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 2s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql://awning:awning@localhost:5432/awning?schema=public
      DIRECT_URL: postgresql://awning:awning@localhost:5432/awning?schema=public
      # Without this the request-path client falls back to the OWNER role, which is
      # RLS-exempt, and nine isolation tests fail describing symptoms rather than cause.
      APP_DATABASE_URL: postgresql://awning_app:awning_app@localhost:5432/awning?schema=public
      REDIS_URL: redis://localhost:6379

    steps:
      - uses: actions/checkout@v4
      # No `version:` here — package.json's packageManager field is authoritative, and
      # specifying both makes the action refuse to install anything at all.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }

      - run: pnpm install --frozen-lockfile
      # Prisma's types come from the generated client, not from the schema. Without this
      # every model is `{}` and the build fails on a field that plainly exists.
      - run: pnpm --filter @awning/db exec prisma generate
      - run: pnpm gen:spec
      # Generated artefacts must match their source. If this fails, someone
      # hand-edited a generated file. See docs/05-COMPONENTS.md §1.
      - run: git diff --exit-code -- packages/spec/generated || (echo "::error::generated spec files are stale — run pnpm gen:spec" && exit 1)

      # Curation data is hand-edited, and a bad entry reaches a customer's site as a
      # missing image or an uncredited photograph.
      - run: pnpm stock:validate

      # The legal documents are compiled to a module with a hash of each one, and
      # acceptance is recorded against that hash. A stale generated file means people
      # are agreeing to text that is not what the repository says it is.
      - run: pnpm gen:legal
      - run: git diff --exit-code -- packages/api/src/legal || (echo "::error::legal documents changed — run pnpm gen:legal" && exit 1)

      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm db:migrate
      # The migration creates awning_app without a password, because a migration is
      # version-controlled. Give it the throwaway CI one so the role can connect at all.
      - run: pnpm --filter @awning/db run dev:roles
      - run: pnpm test

      # The image is not exercised by any test, so without this it breaks quietly and
      # the first person to find out is whoever is trying to deploy a fix.
      - name: docker image builds
        run: |
          docker build --build-arg APP=render -t awning-render:ci .
          docker build --build-arg APP=app    -t awning-app:ci .

      # Building is not running: the image built cleanly while the Prisma query engine
      # was missing from it, and only starting the container found that. This catches
      # that class — runtime failures in the production image.
      #
      # It does NOT catch dev-only bundler failures; `next dev` compiles edge entries
      # differently and can be broken while the production build is fine. Running
      # `pnpm dev` is still the only thing that finds those.
      - name: the apps actually serve a page
        run: |
          set -e
          docker run -d --name smoke-app --network host \
            -e NODE_ENV=production -e PORT=8081 \
            -e DATABASE_URL="$DATABASE_URL" -e DIRECT_URL="$DIRECT_URL" \
            -e APP_DATABASE_URL="$APP_DATABASE_URL" -e REDIS_URL="$REDIS_URL" \
            -e BETTER_AUTH_SECRET=ci-only-secret-0123456789abcdef \
            -e APP_URL=http://localhost:8081 -e SITES_ROOT_DOMAIN=awningsites.localhost \
            awning-app:ci
          for i in $(seq 1 30); do
            curl -fsS "http://localhost:8081/api/health" >/dev/null 2>&1 && break
            sleep 2
          done
          echo "== deep health"
          curl -fsS "http://localhost:8081/api/health/deep"
          echo
          echo "== a real page, server-rendered"
          curl -fsS "http://localhost:8081/legal/terms" | grep -q "Terms of Service"
          curl -fsS "http://localhost:8081/sign-in" >/dev/null
          echo "app serves pages"
          docker logs smoke-app 2>&1 | grep -i "UnhandledSchemeError" && exit 1 || true
          docker rm -f smoke-app
